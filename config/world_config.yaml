# Indoor Simulation World Configuration
# Clean Arena Setup: Initial empty floor with boundary walls
# Obstacles and paths are added interactively by the user

world:
  name: "Robotics_Laboratory_Indoor_Arena"
  width: 10.0   # meters along X axis
  height: 8.0   # meters along Y axis
  grid_resolution: 0.05  # 5 cm per occupancy grid cell (200 x 160 cells)

# Outer perimeter boundary walls [x1, y1, x2, y2]
boundary_walls:
  - [0.0, 0.0, 10.0, 0.0]  # South wall
  - [10.0, 0.0, 10.0, 8.0] # East wall
  - [10.0, 8.0, 0.0, 8.0]  # North wall
  - [0.0, 8.0, 0.0, 0.0]   # West wall

# Interior walls (empty initially for clear arena)
interior_walls: []

# Static obstacles (empty initially: user adds obstacles via Right-Click or 'O' key)
obstacles: []

# Pre-defined reference points
waypoints:
  start_position: [1.2, 1.5, 0.0]
  goal_position: [8.5, 4.8, 90.0]
  patrol_points:
    - [1.2, 1.5, 0.0]
    - [1.5, 6.5, 90.0]
    - [5.5, 3.2, 0.0]
    - [8.5, 4.8, 90.0]
    - [8.5, 1.5, 270.0]
